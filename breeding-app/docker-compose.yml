services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: breeding
      POSTGRES_PASSWORD: breeding
      POSTGRES_DB: breeding
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breeding -d breeding"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://breeding:breeding@db:5432/breeding
      SEED_DEMO: "1"   # 首次启动写入虚构演示数据；置 0 关闭
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
